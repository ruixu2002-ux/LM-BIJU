<script>
const M=JSON.parse(document.getElementById('data').textContent);const $=s=>document.querySelector(s);
const kb=b=>(b/1024).toFixed(0)+' KB';
const uses=[...new Set(M.assets.map(a=>a.useLabel))];$('#fu').insertAdjacentHTML('beforeend',uses.map(u=>`<option>${u}</option>`).join(''));
const tot=M.assets.reduce((s,a)=>s+a.variants.reduce((t,v)=>t+(v.bytes||0),0),0);
$('#stats').innerHTML=`<span>${M.assets.length} assets</span><span>${M.assets.reduce((s,a)=>s+a.variants.length,0)} ficheiros</span><span>${(tot/1048576).toFixed(1)} MB total</span><span>gerado ${M.generated.slice(0,16).replace('T',' ')}</span>`;
function best(a){const jp=a.variants.filter(v=>v.format==='jpg');if(jp.length)return jp.sort((x,y)=>y.width-x.width)[0];const av=a.variants.filter(v=>v.format==='avif');return av[Math.floor(av.length/2)]||a.variants[0]}
function card(a){const b=best(a);const isVid=b.format==='mp4';
  const media=isVid?`<video src="${b.file}" muted loop playsinline controls preload="none" poster="video/video-poster-540.jpg"></video>`:`<button class="thumb" type="button" data-src="${b.file}" data-cap="${a.id} · ${b.width}×${b.height}"><img src="${b.file}" alt="${a.id}" loading="lazy"></button>`;
  const sizes=[...new Set(a.variants.map(v=>v.width+'×'+v.height))];
  const res=a.resolutionOk?'<span class="pill ok">Resolução OK</span>':'<span class="pill warn">Abaixo do alvo</span>';
  return `<article class="card">${isVid?`<div class="thumb">${media}</div>`:media}<div class="body"><div class="id">${a.id}</div>
   <div class="row"><span class="pill">${a.source}</span><span class="pill">${a.useLabel}</span>${res}${a.aiLabel?'<span class="pill ai">IA</span>':''}</div>
   ${a.aiLabel?'<div class="ai">Imagem ilustrativa gerada por IA</div>':''}
   <div><b>Uso:</b> ${a.placement}</div>
   <div class="muted">Origem: ${a.sourceFile}${a.sourceSize?' ('+a.sourceSize+')':''}</div>
   <div class="muted">Tamanhos: ${sizes.slice(0,8).join(', ')}${sizes.length>8?' …':''}</div>
   <div class="muted">Alvo: ${a.resolution.needed||'—'} · real: ${a.resolution.actual||'—'}${a.brightness!=null?' · luminância média '+a.brightness:''}</div>
   <div class="${a.resolutionOk?'muted':'warn'}">${a.restriction||''}</div>
   <details><summary>${a.variants.length} ficheiros</summary><ul>${a.variants.map(v=>`<li>${v.file} · ${v.width}×${v.height} · ${kb(v.bytes||0)}</li>`).join('')}</ul></details></div></article>`}
function render(){const s=$('#fs').value,u=$('#fu').value,r=$('#fr').value,ai=$('#fa').value;
  const list=M.assets.filter(a=>(!s||a.source===s)&&(!u||a.useLabel===u)&&(!r||String(+a.resolutionOk)===r)&&(!ai||String(+a.aiLabel)===ai));
  const groups=['Legacy','MJ','Video'];$('#out').innerHTML=groups.map(g=>{const l=list.filter(a=>a.source===g);return l.length?`<h2>${g} · ${l.length}</h2><div class="grid">${l.map(card).join('')}</div>`:''}).join('');
  $('#count').textContent=list.length+' assets'}
['#fs','#fu','#fr','#fa'].forEach(s=>$(s).addEventListener('change',render));render();
document.addEventListener('click',e=>{const t=e.target.closest('[data-src]');if(t){const d=$('#lb');d.querySelector('img').src=t.dataset.src;d.querySelector('img').alt=t.dataset.cap;d.querySelector('p').textContent=t.dataset.cap;d.showModal()}
  if(e.target.closest('#lb button')||e.target.id==='lb')$('#lb').close()});
</script>
